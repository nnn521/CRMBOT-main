# ===========================================================================
# 丰田汽车销售 - 价格谈判话术模板
# ===========================================================================
# 用于 sales_negotiation_node 的价格谈判场景匹配与回复生成
# LLM 会根据客户消息匹配场景，结合模板生成个性化回复
# ===========================================================================

# ── 全局谈判原则（注入 LLM System Prompt）──────────────────────────────────
principles:
  - "不主动降价：先强调产品价值（品质、配置、保值率、售后服务），再谈价格"
  - "不报底价：永远不说「这是最低价」，保留谈判空间"
  - "不贬竞品：被比价时客观承认竞品优势，再强调丰田差异化卖点"
  - "引导试驾：价格谈不拢时引导到店试驾，线下转化率远高于线上"
  - "算总账：客户说贵时帮算落地价（购置税+保险+上牌），突出丰田低油耗/低保养/高保值"
  - "给台阶：客户坚持要优惠时给小额赠品（脚垫/贴膜/保养券），避免直接降价"
  - "逼单话术：限时优惠/库存紧张/月底冲量，制造合理紧迫感"

# ── 谈判场景定义 ──────────────────────────────────────────────────────────
scenarios:

  # ═══ 场景 1：要求折扣/优惠 ═══
  - id: discount_request
    name: "要求折扣优惠"
    trigger_keywords: "便宜, 优惠, 折扣, 打折, 降价, 能不能少, 最低多少, 底价, 还能少吗, 便宜点, 有点贵, 太贵了, 超预算, 能不能低, 价格不合适, 价格不太满意"
    response_strategies:
      - strategy: "价值锚定"
        template: |
          我理解您对价格的考虑。不过我想先跟您确认一下，这款车的配置您都了解了吗？

          {model_name} 在这个价位里：
          · 标配 {key_feature_1}，同级少有的全系标配
          · 百公里油耗仅 {fuel_economy}L，一年能省 {annual_saving} 油费
          · 3年保值率达 {resale_value}%，开三年卖也亏不了多少

          这样算下来，每天的成本其实只有一杯咖啡钱
          要不您先来店里试驾感受一下？开过之后您会觉得这个价格真的值。
      - strategy: "落地价拆解"
        template: |
          买车不能只看裸车价，我帮您算笔落地账：

          【{model_name} 落地费用】
          · 裸车指导价：{guide_price}万
          · 购置税：约 {tax} 元
          · 保险（全险）：约 {insurance} 元
          · 上牌费：{plate_fee} 元
          ───────────────
          落地参考：约 {total_price} 万

          相比同级别竞品，我们裸车价可能略高，但落地后综合用车成本是最低的——
          丰田的油耗、保养、保值率，三年下来至少帮您省 {three_year_saving} 万。
    suggested_actions:
      - "预约试驾体验"
      - "查看金融分期方案"
      - "了解更多配置详情"

  # ═══ 场景 2：竞品比价 ═══
  - id: price_comparison
    name: "拿竞品比价"
    trigger_keywords: "比, 不如, 人家, 别家, 竞品, 比亚迪, 本田, 大众, 日产, 吉利, 特斯拉, 同样的价格, 隔壁, 其他品牌, 为什么贵, 贵这么多, 不值"
    response_strategies:
      - strategy: "差异化对比"
        template: |
          您说的 {competitor_name} 确实是不错的车，各有千秋。

          不过我帮您对比一下关键差异：

          | 对比维度 | 丰田 {model_name} | {competitor_name} |
          |---------|------------------|-------------------|
          | 油耗 | {our_fuel}L/100km | {comp_fuel}L/100km |
          | 保值率(3年) | {our_resale}% | {comp_resale}% |
          | 保养成本/年 | {our_maintenance}元 | {comp_maintenance}元 |

          丰田的优势在于省心耐用——开五年基本不用操心，二手卖掉也值钱。
          很多客户买丰田就是为了这个。要不您来店里两台车都试驾一下，亲身体验最直观
      - strategy: "价值认同+差异化"
        template: |
          没错，{competitor_name} 在某些方面确实做得好（比如{comp_advantage}）。

          但选车要看长期——丰田的核心优势：
          · 故障率行业最低，开十年不大修
          · 混动技术最成熟，市区油耗控制最好
          · 保值率常年第一，换车时不心疼

          多花一点买的是安心和省心，您觉得呢？
    suggested_actions:
      - "对比试驾体验"
      - "查看详细配置对比"
      - "了解丰田保值优势"

  # ═══ 场景 3：询问分期/金融方案 ═══
  - id: financing_inquiry
    name: "询问分期金融方案"
    trigger_keywords: "分期, 按揭, 贷款, 月供, 首付, 金融方案, 能不能分期, 供车, 全款买不起, 有没有免息, 0利率, 月供多少, 贷几年"
    response_strategies:
      - strategy: "金融方案展示"
        template: |
          我们提供多种金融方案，帮您灵活购车：

          【{model_name} 金融方案参考】
          ┌──────────┬────────────┬────────────┐
          │   方案   │   首付     │   月供     │
          ├──────────┼────────────┼────────────┤
          │ 24期免息 │ {down_24}万 │ {monthly_24}元 │
          │ 36期低息 │ {down_36}万 │ {monthly_36}元 │
          │ 60期超长 │ {down_60}万 │ {monthly_60}元 │
          └──────────┴────────────┴────────────┘

          首付最低 {min_down} 万就能开回家，月供不到 {min_monthly} 元。
          而且现在还有 {promotion_info} 的活动，要不要帮您算一个具体的方案？
    suggested_actions:
      - "获取详细金融方案"
      - "预约到店详谈"
      - "申请预审批"

  # ═══ 场景 4：预算不够 ═══
  - id: budget_constraint
    name: "预算不够"
    trigger_keywords: "买不起, 预算不够, 超预算, 没钱, 不够钱, 只能买, 预算有限, 最多, 只有, 就这么多钱"
    response_strategies:
      - strategy: "阶梯降档"
        template: |
          完全理解，预算确实是重要的考量因素。

          如果您预算在 {budget_range} 万左右，我给您两个思路：

          A. 同系低配版：{model_name} 的低配版 {low_trim_name}，
             核心配置都在（{low_trim_features}），落地约 {low_trim_price} 万

          B. 降一级车型：{lower_model}，同样丰田品质，
             落地约 {lower_price} 万，空间和油耗表现也很出色

          要不先来看看这两款？说不定试驾之后就认定它了呢
    suggested_actions:
      - "查看低配版配置"
      - "了解降级车型"
      - "申请金融方案"

  # ═══ 场景 5：逼问底价 ═══
  - id: final_price_push
    name: "逼问最低价"
    trigger_keywords: "最低价, 底价, 一口价, 最终价, 痛快, 爽快, 直接说, 最便宜多少, 别绕, 不要套路, 实在价, 心里价位, 不砍了, 最后一次, 说个实价"
    response_strategies:
      - strategy: "限时优惠+赠品"
        template: |
          您是个爽快人，我也不绕弯子。

          目前 {model_name} 确实有一些优惠政策：
          · 本月厂家冲量，现金优惠最高 {cash_discount} 元
          · 送 {gift_package}（价值约 {gift_value} 元）
          · {insurance_offer}

          这是我们目前能给到的最大诚意了。这个月活动还剩 {days_left} 天，
          说实话卖完这批就没有了。您方便这两天来店里吗？
      - strategy: "领导审批套路"
        template: |
          说实话，这个价格已经是我们的底线了。

          要不这样——您来店里，我帮您找销售经理特批一下，
          看能不能再争取一点。但必须当面聊，电话里经理没法批。

          您方便明天还是后天过来？我提前帮您约好试驾
    suggested_actions:
      - "预约到店面谈"
      - "锁定限时优惠"

  # ═══ 场景 6：要赠品/礼包 ═══
  - id: gift_inquiry
    name: "索要赠品礼包"
    trigger_keywords: "送, 赠品, 礼包, 大礼包, 精品, 额外, 附带, 送什么, 有什么送, 脚垫, 贴膜, 保养券, 行车记录仪, 别人都送, 隔壁送"
    response_strategies:
      - strategy: "赠品价值包装"
        template: |
          购车礼包方面，现在订车可以赠送：

          {model_name} 购车精品礼包
          · {gift_item_1} — 价值约 {gift1_value} 元
          · {gift_item_2} — 价值约 {gift2_value} 元
          · {gift_item_3} — 价值约 {gift3_value} 元

          这些加起来也值 {total_gift_value} 多了，而且都是原厂件，品质有保证。
          您要是今天就定下来，我再帮您申请 {extra_gift}
    suggested_actions:
      - "锁定礼包优惠"
      - "预约到店签约"

  # ═══ 场景 7：团购/多人买 ═══
  - id: group_purchase
    name: "团购/多人购车"
    trigger_keywords: "团购, 一起买, 几台, 多台, 朋友也买, 公司采购, 车队, 两台, 三台, 批发, 批量"
    response_strategies:
      - strategy: "团购专属优惠"
        template: |
          团购确实有额外优惠！如果您这边有 {group_size} 台以上的需求：

          大客户/团购专属政策
          · 专属团购折扣（具体根据台数谈）
          · 统一配色/配置可选
          · 专属交车仪式
          · 大客户售后VIP通道

          具体优惠幅度我需要跟大客户经理确认，方便告诉我大概几台、什么配置吗？
          团购价格一定让您满意
    suggested_actions:
      - "获取团购报价"
      - "联系大客户经理"

  # ═══ 场景 8：默认/通用谈判 ═══
  - id: general_negotiation
    name: "通用价格谈判"
    trigger_keywords: ""
    response_strategies:
      - strategy: "价值重申+引导到店"
        template: |
          感谢您的关注！关于价格方面，我们可以在以下几个方面帮您：

          省钱攻略
          1. 现金优惠 — 根据车型和库存，有一定现金优惠空间
          2. 金融分期 — 低首付 + 低月供，不占用太多现金流
          3. 置换补贴 — 旧车置换可享额外补贴
          4. 精品礼包 — 购车即送原厂精品

          不过具体能优惠多少，还是需要您到店详谈——面对面聊，我能帮您争取到的空间更大。
          您方便哪天来店里？我提前帮您安排好试驾
    suggested_actions:
      - "预约到店详谈"
      - "查询最新优惠"
      - "了解金融方案"
