# ===========================================================================
# 丰田汽车销售 - 投诉处理话术模板
# ===========================================================================
# 用于 complaint_handler_node 的投诉场景匹配与回复生成
# LLM 会根据客户消息匹配场景，结合模板生成个性化回复
# ===========================================================================

# ── 全局投诉处理原则（注入 LLM System Prompt）────────────────────────────
principles:
  - "先共情后解决：第一时间表达歉意和理解，绝不推诿或争辩"
  - "记录优先：详细记录客户投诉内容、时间、诉求，确保可追溯"
  - "分级响应：轻微投诉现场解决，严重投诉立即升级主管/售后经理"
  - "限时承诺：给出明确的处理时限（如2小时内回复），绝不让客户干等"
  - "超预期补偿：在权限范围内提供超出客户预期的补偿方案（保养券、精品礼包等）"
  - "闭环跟进：问题解决后48小时内回访，确认客户满意"

# ── 投诉场景定义 ──────────────────────────────────────────────────────────
scenarios:

  # ═══ 场景 1：产品质量投诉 ═══
  - id: product_quality
    name: "产品质量投诉"
    trigger_keywords: "质量问题, 坏了, 故障, 异响, 漏水, 漏油, 变速箱, 发动机, 车身, 漆面, 生锈, 脱落, 开裂, 抖动, 顿挫, 变速箱异响, 发动机故障灯, 质量差, 不合格, 有问题"
    response_strategies:
      - strategy: "技术安抚+快速检修"
        template: |
          非常抱歉给您带来了不好的用车体验！车辆出现{problem_desc}确实让人闹心，我完全理解您的心情。

          我马上为您安排：
          1. 优先预约最近的售后技师为您做全面检测
          2. 检测期间提供代步车或交通补贴
          3. 如属质量问题，维修费用由厂家承担（三包范围内）

          请问您的车牌号是多少？我帮您预约最早的检测时段，一般今天或明天就能安排上。
      - strategy: "三包政策说明"
        template: |
          您反馈的{problem_desc}问题我们非常重视。根据国家三包政策：

          · 整车质保：3年或10万公里（以先到为准）
          · 核心部件（发动机、变速箱）：质保更长
          · 同一故障维修超过5次可申请换车

          我建议您先到店检测确认故障原因，如果是质量问题，维修/更换费用全部由厂家承担。
          方便告诉我您的车型和购车时间吗？我帮您查一下质保状态。
    suggested_actions:
      - "预约售后检测"
      - "了解三包政策"
      - "转接售后经理"

  # ═══ 场景 2：服务态度投诉 ═══
  - id: service_attitude
    name: "服务态度投诉"
    trigger_keywords: "态度差, 服务差, 不理人, 态度不好, 翻白眼, 不耐烦, 嚣张, 甩脸色, 不尊重, 冷漠, 敷衍, 推诿, 踢皮球, 没人管, 没人理, 没人回, 拖延, 不专业"
    response_strategies:
      - strategy: "诚恳道歉+人员处理"
        template: |
          真的非常抱歉！您在我们店遇到这样的服务体验，这是我们绝对不能容忍的。

          我已经记录了具体情况：
          · 投诉时间：{complaint_time}
          · 涉及人员：{staff_info}
          · 具体问题：{problem_desc}

          我们会在24小时内：
          1. 由售后经理亲自联系您了解详情
          2. 对相关人员进行严肃处理
          3. 给您一个满意的处理方案

          再次向您诚挚道歉，我们一定整改到位。
      - strategy: "VIP补偿+升级服务"
        template: |
          听到您的遭遇我非常痛心，这完全不符合我们丰田的服务标准。

          为了弥补给您造成的不愉快，我这边可以为您安排：
          · 升级为VIP客户通道，后续所有服务优先处理
          · 赠送一次免费基础保养（价值约500元）
          · 安排资深服务顾问一对一对接您

          同时我已将此事上报门店经理，一定会给您一个交代。
          请问方便留个电话吗？我让经理亲自给您回电致歉。
    suggested_actions:
      - "投诉升级处理"
      - "获取VIP补偿方案"
      - "转接门店经理"

  # ═══ 场景 3：交车延迟 ═══
  - id: delivery_delay
    name: "交车延迟投诉"
    trigger_keywords: "交车, 延迟, 迟迟, 还没到, 等多久, 说好的, 什么时候, 推迟, 拖延, 等了一个月, 两个月, 半个月, 说好周, 没车, 没现车, 缺货, 没到货, 排产, 等不了"
    response_strategies:
      - strategy: "透明进度+加急处理"
        template: |
          非常理解您的心情，等车确实煎熬。之前承诺的时间没能兑现，是我们的问题，先跟您说声抱歉。

          我马上帮您查最新进度：
          · 您的订单目前状态：{order_status}
          · 预计到店时间：{estimated_date}
          · 延迟原因：{delay_reason}

          我会做以下安排：
          1. 标记您的订单为优先级，到车后第一时间通知
          2. 如果超过承诺时间7天以上，申请额外补偿（保养券/精品）
          3. 每周主动向您更新一次物流进度

          实在等不及的话，我也可以帮您看看周边城市有没有现车调拨的可能。
      - strategy: "现车调配+补偿方案"
        template: |
          抱歉让您久等了！交车延迟确实是我们的责任。

          我这边有两个方案供您选择：

          方案A：继续等待 + 补偿
          · 预计{estimated_date}到车
          · 赠送首保免费 + 全车贴膜（价值约2000元）

          方案B：调拨现车
          · 我帮您查询周边库存，可能有同配置现车
          · 颜色/配置可能略有差异，但可以更快提车

          您倾向于哪个方案？不管选哪个，延迟的补偿一定不会少。
    suggested_actions:
      - "查询订单进度"
      - "申请调拨现车"
      - "获取延迟补偿"

  # ═══ 场景 4：额外收费/加价投诉 ═══
  - id: extra_charges
    name: "额外收费/加价投诉"
    trigger_keywords: "加价, 额外收费, 强制消费, 捆绑销售, 强制买保险, 强制装潢, 金融服务费, 出库费, PDI检测费, 上牌费太贵, 乱收费, 不合理收费, 多收钱, 坑人, 黑心, 套路, 说好的价格, 临时加价, 落地价变了"
    response_strategies:
      - strategy: "费用透明化+退费承诺"
        template: |
          我理解您对费用的疑虑，买车是大事，每一分钱都要花得明明白白。

          我帮您逐项核对一下费用明细：
          · 裸车价：{car_price}
          · 购置税：{purchase_tax}（国家统一标准）
          · 保险：{insurance}（可自行选择）
          · 上牌费：{plate_fee}（车管所标准）
          · 其他费用：{other_fees}

          如果存在任何不合理的收费项目，我们一定会退还。
          您方便把报价单发给我看看吗？我帮您逐项核实，有问题的费用马上处理。
      - strategy: "投诉升级+费用复核"
        template: |
          收到您的反馈，这种情况我们非常重视。

          请您放心：
          1. 我已将情况上报门店经理和区域督导
          2. 48小时内安排专人与您核对所有费用明细
          3. 如确认存在不合理收费，全额退还并额外补偿

          我们丰田一直坚持透明消费，绝不允许加价或强制消费行为。
          请问方便提供一下您的购车合同或报价单吗？我帮您加急复核。
    suggested_actions:
      - "费用明细复核"
      - "投诉升级至区域督导"
      - "申请退费"

  # ═══ 场景 5：售后维修投诉 ═══
  - id: price_dispute
    name: "购车后价格争议"
    trigger_keywords: "刚买完就降价, 买完降价, 降价, 背刺, 欺骗, 价格欺诈, 同车不同价, 价格争议"
    response_strategies:
      - strategy: "核查成交政策+补偿评估"
        template: |
          非常抱歉这次价格变化让您感到被忽视，我完全理解刚购车就看到降价信息的心情，也非常重视您的价格争议。

          我会立即为您安排核查：
          1. 对比您的成交日期、合同价格与当前活动生效时间
          2. 请销售经理检查是否存在适用的厂家关怀或等值服务方案
          3. 在2小时内主动联系您说明核查结果和处理方案

          我会持续跟进到您收到明确答复，不让您的问题无人处理。
    suggested_actions:
      - "核查成交政策"
      - "联系销售经理"
      - "申请关怀方案"

  - id: after_sales
    name: "售后维修投诉"
    trigger_keywords: "售后, 维修, 保养, 修不好, 越修越坏, 等配件, 配件贵, 维修费, 太贵了, 保养贵, 小病大修, 过度维修, 修了又坏, 反复修, 没修好, 排队久, 预约不到, 态度差"
    response_strategies:
      - strategy: "技术复核+费用复议"
        template: |
          非常抱歉维修体验不佳！车辆维修质量和服务效率是我们的生命线。

          我马上帮您处理：
          1. 安排资深技师对您的车辆做二次检测
          2. 如属维修质量问题，返修费用全免
          3. 维修期间提供代步车或交通补贴

          请问方便告诉我您的车牌号和上次维修的工单号吗？
          我会调出完整维修记录，确保问题彻底解决。
      - strategy: "投诉受理+售后经理跟进"
        template: |
          您反馈的问题我已详细记录，这对提升我们的服务水平非常重要。

          接下来会这样处理：
          · 2小时内售后经理亲自联系您
          · 对维修方案和费用进行二次审核
          · 如有异议，支持到第三方机构复检

          我们的售后监督热线是：400-XXX-XXXX
          也可以直接拨打丰田客服热线：800-810-1210

          一定给您一个满意的解决方案。
    suggested_actions:
      - "预约售后复检"
      - "联系售后经理"
      - "拨打厂家客服热线"

  # ═══ 场景 6：通用兜底 ═══
  - id: general_complaint
    name: "通用投诉处理"
    trigger_keywords: ""
    response_strategies:
      - strategy: "通用投诉受理"
        template: |
          非常抱歉给您带来了不好的体验！

          您的投诉我已经记录下来：
          · 投诉内容：已详细记录
          · 受理时间：{complaint_time}
          · 处理承诺：2小时内有专人联系您

          我会立即安排处理：
          1. 将问题反馈给相关部门负责人
          2. 2小时内给您回复初步处理方案
          3. 全程跟进直到问题解决

          请问方便留个电话吗？方便我们及时联系您。
          再次为给您造成的不便深表歉意，我们一定妥善处理。
    suggested_actions:
      - "反馈详细信息"
      - "转接人工客服"
      - "留下联系方式"
