# Standalone infrastructure only. Always pass this file explicitly with -f;
# do not merge it with the application's existing Compose files.
name: crmbot-rag-v2

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: crmbot_knowledge_v2
      POSTGRES_USER: rag_v2_owner
      # Required, with no fallback password. Generate >=32 random bytes locally.
      POSTGRES_PASSWORD: ${RAG_V2_POSTGRES_PASSWORD:?Set a strong RAG_V2_POSTGRES_PASSWORD in a private external env file}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:${RAG_V2_POSTGRES_PORT:-55432}:5432"
    volumes:
      - rag_v2_pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Optional alternative to a native Windows Ollama installation.
  # The stock entrypoint only serves Ollama; no model is pulled automatically.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - rag_v2_ollama_models:/root/.ollama
    gpus: all
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped

# Compose prefixes these volumes with the independent project name above.
# No external volumes, old database mounts, or automatic migration hooks.
volumes:
  rag_v2_pgdata:
  rag_v2_ollama_models:
