# CRMBOT 服务编排
# 包含：Backend API + PostgreSQL + Ollama

services:
  # ========== 后端 API 服务 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crmbot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"       # HTTP 与 WebSocket 共用同一 ASGI 服务
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      # 生产安全基线：必须显式声明 production，否则 FAISS 危险反序列化默认关闭
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://crmbot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/crmbot
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-chat}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - OLLAMA_BASE_URL=http://ollama:11434
      # 多模态（可选）
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # Hermes 内部助手（可选）
      - HERMES_API_URL=${HERMES_API_URL:-http://host.docker.internal:8642/v1}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173"]}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-10}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-10}
      - CHAT_RATE_LIMIT=${CHAT_RATE_LIMIT:-30}
      - REPORT_RATE_LIMIT=${REPORT_RATE_LIMIT:-10}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./data:/app/data           # 知识库 + 模板 + 图片
      - ./output:/app/output       # 生成文档输出
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crmbot-net

  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: crmbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crmbot
      POSTGRES_USER: crmbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmbot -d crmbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crmbot-net

  # ========== Ollama 本地模型服务 ==========
  # 注意：首次使用需手动拉取嵌入模型：docker compose exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    container_name: crmbot-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crmbot-net

volumes:
  postgres-data:
  ollama-data:

networks:
  crmbot-net:
    driver: bridge
